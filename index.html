<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAISON NOIR — Luxury Fashion</title>

  <meta name="description"
        content="MAISON NOIR — A modern luxury fashion house redefining elegance.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #080808;
      color: #f5f1e8;
      font-family: "Inter", sans-serif;
      overflow-x: hidden;
    }

    body.loaded {
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      width: 100%;
      display: block;
    }

    button {
      font-family: inherit;
    }


    /* =========================
       LOADER
    ========================= */

    #loader {
      position: fixed;
      inset: 0;
      background: #050505;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease, visibility 1s ease;
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loader-content {
      text-align: center;
    }

    .loader-logo {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(2rem, 5vw, 4rem);
      letter-spacing: 12px;
      color: #d6b56d;
      animation: loaderPulse 1.8s infinite;
    }

    .loader-line {
      width: 180px;
      height: 1px;
      background: #272727;
      margin: 25px auto;
      overflow: hidden;
    }

    .loader-line::after {
      content: "";
      display: block;
      height: 100%;
      width: 50%;
      background: #d6b56d;
      animation: loadingLine 1.5s infinite;
    }

    @keyframes loadingLine {
      0% {
        transform: translateX(-180px);
      }

      100% {
        transform: translateX(360px);
      }
    }

    @keyframes loaderPulse {
      50% {
        opacity: .45;
      }
    }


    /* =========================
       CURSOR GLOW
    ========================= */

    .cursor-glow {
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(214,181,109,.09),
        transparent 65%
      );
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 0;
      transition: transform .15s ease;
    }


    /* =========================
       NAVBAR
    ========================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 24px 5%;
      transition: .5s ease;
    }

    header.scrolled {
      background: rgba(5,5,5,.82);
      backdrop-filter: blur(18px);
      padding: 16px 5%;
      border-bottom: 1px solid rgba(214,181,109,.15);
    }

    .nav {
      max-width: 1400px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: "Cormorant Garamond", serif;
      font-size: 28px;
      letter-spacing: 7px;
      color: #fff;
    }

    .logo span {
      color: #d6b56d;
    }

    .nav-links {
      display: flex;
      gap: 38px;
      list-style: none;
    }

    .nav-links a {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      position: relative;
      padding-bottom: 6px;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 1px;
      background: #d6b56d;
      transition: .4s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-button {
      border: 1px solid #d6b56d;
      background: transparent;
      color: #d6b56d;
      padding: 12px 20px;
      font-size: 10px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: .4s ease;
    }

    .nav-button:hover {
      background: #d6b56d;
      color: #080808;
      transform: translateY(-2px);
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: white;
      font-size: 27px;
      cursor: pointer;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,.88),
          rgba(0,0,0,.38),
          rgba(0,0,0,.15)
        ),
        url("https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=2200&q=90")
        center/cover;
      transform: scale(1.08);
      animation: heroZoom 12s ease-out forwards;
    }

    @keyframes heroZoom {
      from {
        transform: scale(1.15);
      }

      to {
        transform: scale(1);
      }
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.2),
          rgba(0,0,0,.3),
          #080808
        );
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 1400px;
      margin: auto;
      padding-top: 80px;
    }

    .eyebrow {
      color: #d6b56d;
      font-size: 11px;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 25px;
      opacity: 0;
      animation: revealUp 1s .4s forwards;
    }

    .hero h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
      font-size: clamp(4rem, 9vw, 9rem);
      line-height: .82;
      max-width: 900px;
      letter-spacing: -3px;
      opacity: 0;
      animation: revealUp 1.2s .6s forwards;
    }

    .hero h1 em {
      color: #d6b56d;
      font-style: italic;
      font-weight: 400;
    }

    .hero-description {
      max-width: 480px;
      margin-top: 35px;
      color: #c8c8c8;
      line-height: 1.8;
      font-size: 14px;
      opacity: 0;
      animation: revealUp 1s .9s forwards;
    }

    .hero-actions {
      display: flex;
      gap: 20px;
      margin-top: 40px;
      opacity: 0;
      animation: revealUp 1s 1.1s forwards;
    }

    .btn {
      padding: 16px 28px;
      border: 1px solid #d6b56d;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 10px;
      transition: .4s ease;
      display: inline-block;
    }

    .btn-gold {
      background: #d6b56d;
      color: #080808;
    }

    .btn-gold:hover {
      background: transparent;
      color: #d6b56d;
      transform: translateY(-4px);
      box-shadow: 0 10px 40px rgba(214,181,109,.15);
    }

    .btn-outline {
      color: #fff;
    }

    .btn-outline:hover {
      background: #fff;
      color: #080808;
      transform: translateY(-4px);
    }

    .scroll-indicator {
      position: absolute;
      bottom: 35px;
      left: 5%;
      display: flex;
      align-items: center;
      gap: 15px;
      color: #aaa;
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      z-index: 2;
    }

    .scroll-line {
      width: 55px;
      height: 1px;
      background: #d6b56d;
      animation: scrollLine 2s infinite;
    }

    @keyframes scrollLine {
      0%,100% {
        width: 30px;
      }

      50% {
        width: 70px;
      }
    }

    @keyframes revealUp {
      from {
        opacity: 0;
        transform: translateY(45px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* =========================
       INTRO
    ========================= */

    .intro {
      padding: 150px 7%;
      text-align: center;
      position: relative;
    }

    .section-label {
      color: #d6b56d;
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    .intro h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(3rem, 6vw, 6rem);
      font-weight: 400;
      line-height: .95;
      max-width: 1000px;
      margin: auto;
    }

    .intro h2 span {
      color: #777;
    }

    .intro p {
      max-width: 620px;
      margin: 35px auto 0;
      color: #aaa;
      line-height: 1.9;
      font-size: 14px;
    }


    /* =========================
       COLLECTION
    ========================= */

    .collection {
      padding: 80px 5% 150px;
      max-width: 1500px;
      margin: auto;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 55px;
    }

    .section-heading h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(3rem, 5vw, 5rem);
      font-weight: 400;
    }

    .section-heading p {
      color: #888;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
    }

    .fashion-card {
      position: relative;
      overflow: hidden;
      min-height: 620px;
      cursor: pointer;
      background: #111;
    }

    .fashion-card.large {
      min-height: 760px;
    }

    .fashion-card img {
      height: 100%;
      object-fit: cover;
      transition: transform 1.2s cubic-bezier(.2,.7,.2,1);
      filter: brightness(.72);
    }

    .fashion-card:hover img {
      transform: scale(1.08);
      filter: brightness(.88);
    }

    .fashion-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        transparent 30%,
        rgba(0,0,0,.88)
      );
    }

    .card-content {
      position: absolute;
      left: 35px;
      right: 35px;
      bottom: 35px;
      z-index: 2;
      transform: translateY(15px);
      transition: .6s ease;
    }

    .fashion-card:hover .card-content {
      transform: translateY(0);
    }

    .card-number {
      color: #d6b56d;
      font-size: 10px;
      letter-spacing: 3px;
    }

    .card-content h3 {
      font-family: "Cormorant Garamond", serif;
      font-size: 48px;
      font-weight: 400;
      margin: 10px 0;
    }

    .card-content p {
      color: #bbb;
      font-size: 13px;
      max-width: 350px;
      line-height: 1.7;
    }

    .card-link {
      display: inline-block;
      margin-top: 20px;
      color: #d6b56d;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-bottom: 1px solid #d6b56d;
      padding-bottom: 5px;
    }


    /* =========================
       STATEMENT
    ========================= */

    .statement {
      min-height: 80vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 7%;
      overflow: hidden;
    }

    .statement-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          rgba(0,0,0,.72),
          rgba(0,0,0,.72)
        ),
        url("https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=2200&q=90")
        center/cover fixed;
      filter: saturate(.7);
    }

    .statement-content {
      position: relative;
      z-index: 2;
      max-width: 1100px;
    }

    .statement h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(4rem, 8vw, 8rem);
      font-weight: 400;
      line-height: .9;
    }

    .statement h2 span {
      color: #d6b56d;
      font-style: italic;
    }


    /* =========================
       STATS
    ========================= */

    .stats {
      padding: 110px 7%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
      text-align: center;
      border-bottom: 1px solid #1b1b1b;
    }

    .stat h3 {
      font-family: "Cormorant Garamond", serif;
      font-size: 65px;
      font-weight: 400;
      color: #d6b56d;
    }

    .stat p {
      margin-top: 8px;
      color: #888;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }


    /* =========================
       STORY
    ========================= */

    .story {
      max-width: 1300px;
      margin: auto;
      padding: 150px 6%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 100px;
      align-items: center;
    }

    .story-image {
      overflow: hidden;
    }

    .story-image img {
      transition: transform 1s ease;
    }

    .story-image:hover img {
      transform: scale(1.05);
    }

    .story-text .section-label {
      margin-bottom: 20px;
    }

    .story-text h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(3rem, 5vw, 5rem);
      font-weight: 400;
      line-height: .95;
    }

    .story-text p {
      color: #aaa;
      margin-top: 30px;
      line-height: 1.9;
      font-size: 14px;
    }


    /* =========================
       NEWSLETTER
    ========================= */

    .newsletter {
      text-align: center;
      padding: 150px 6%;
      background: #0d0d0d;
      border-top: 1px solid #1c1c1c;
      border-bottom: 1px solid #1c1c1c;
    }

    .newsletter h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(3rem, 6vw, 6rem);
      font-weight: 400;
    }

    .newsletter p {
      color: #888;
      margin: 20px auto 35px;
      max-width: 500px;
      font-size: 13px;
      line-height: 1.8;
    }

    .newsletter-form {
      max-width: 500px;
      margin: auto;
      display: flex;
      border-bottom: 1px solid #555;
    }

    .newsletter-form input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 18px 5px;
      color: white;
      font-size: 13px;
    }

    .newsletter-form button {
      background: none;
      border: none;
      color: #d6b56d;
      letter-spacing: 2px;
      font-size: 10px;
      cursor: pointer;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 80px 6% 35px;
      background: #050505;
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      gap: 50px;
      padding-bottom: 60px;
      border-bottom: 1px solid #1c1c1c;
    }

    .footer-logo {
      font-family: "Cormorant Garamond", serif;
      font-size: 42px;
      letter-spacing: 6px;
    }

    .footer-top p {
      max-width: 300px;
      color: #777;
      font-size: 12px;
      line-height: 1.8;
      margin-top: 15px;
    }

    .footer-links {
      display: flex;
      gap: 70px;
    }

    .footer-column h4 {
      color: #d6b56d;
      font-size: 10px;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    .footer-column a {
      display: block;
      color: #888;
      font-size: 12px;
      margin-bottom: 12px;
      transition: .3s;
    }

    .footer-column a:hover {
      color: white;
    }

    .copyright {
      padding-top: 30px;
      display: flex;
      justify-content: space-between;
      color: #555;
      font-size: 10px;
      letter-spacing: 1px;
    }


    /* =========================
       SCROLL REVEAL
    ========================= */

    .reveal {
      opacity: 0;
      transform: translateY(60px);
      transition:
        opacity 1s ease,
        transform 1s cubic-bezier(.2,.7,.2,1);
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {

      .nav-links {
        position: fixed;
        top: 0;
        right: -100%;
        width: 75%;
        height: 100vh;
        background: rgba(8,8,8,.98);
        backdrop-filter: blur(20px);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 35px;
        transition: .5s ease;
        border-left: 1px solid #222;
      }

      .nav-links.active {
        right: 0;
      }

      .menu-toggle {
        display: block;
        position: relative;
        z-index: 1001;
      }

      .nav-button {
        display: none;
      }

      .hero {
        min-height: 100svh;
      }

      .hero-bg {
        background-position: 65% center;
      }

      .hero-content {
        padding-top: 100px;
      }

      .hero h1 {
        font-size: clamp(4rem, 18vw, 7rem);
      }

      .collection-grid {
        grid-template-columns: 1fr;
      }

      .fashion-card,
      .fashion-card.large {
        min-height: 600px;
      }

      .story {
        grid-template-columns: 1fr;
        gap: 60px;
      }

      .stats {
        grid-template-columns: 1fr;
        gap: 70px;
      }

      .footer-top {
        flex-direction: column;
      }

      .footer-links {
        gap: 40px;
      }
    }


    @media (max-width: 600px) {

      header {
        padding: 20px 6%;
      }

      .logo {
        font-size: 22px;
        letter-spacing: 5px;
      }

      .hero-content {
        width: 88%;
      }

      .hero-description {
        font-size: 13px;
      }

      .hero-actions {
        flex-direction: column;
        align-items: flex-start;
      }

      .btn {
        width: 100%;
        text-align: center;
      }

      .intro {
        padding: 110px 7%;
      }

      .collection {
        padding: 60px 5% 100px;
      }

      .section-heading {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .fashion-card,
      .fashion-card.large {
        min-height: 500px;
      }

      .card-content h3 {
        font-size: 40px;
      }

      .statement {
        min-height: 70vh;
      }

      .stats {
        padding: 90px 6%;
      }

      .story {
        padding: 100px 6%;
      }

      .newsletter {
        padding: 100px 6%;
      }

      .newsletter-form {
        width: 100%;
      }

      .footer-links {
        flex-wrap: wrap;
      }

      .copyright {
        flex-direction: column;
        gap: 12px;
      }

      .cursor-glow {
        display: none;
      }
    }

  </style>
</head>


<body>

  <!-- =========================
       LOADER
  ========================== -->

  <div id="loader">

    <div class="loader-content">

      <div class="loader-logo">
        MAISON NOIR
      </div>

      <div class="loader-line"></div>

    </div>

  </div>


  <!-- Cursor -->

  <div class="cursor-glow"></div>


  <!-- =========================
       NAVIGATION
  ========================== -->

  <header id="header">

    <nav class="nav">

      <a href="#home" class="logo">
        MAISON <span>NOIR</span>
      </a>

      <ul class="nav-links" id="navLinks">

        <li>
          <a href="#home">Home</a>
        </li>

        <li>
          <a href="#collection">Collection</a>
        </li>

        <li>
          <a href="#story">Our Story</a>
        </li>

        <li>
          <a href="#contact">Contact</a>
        </li>

      </ul>

      <a href="#collection" class="nav-button">
        SHOP NOW
      </a>

      <button class="menu-toggle" id="menuToggle">
        ☰
      </button>

    </nav>

  </header>


  <!-- =========================
       HERO
  ========================== -->

  <section class="hero" id="home">

    <div class="hero-bg"></div>

    <div class="hero-overlay"></div>

    <div class="hero-content">

      <div class="eyebrow">
        AUTUMN / WINTER 2026
      </div>

      <h1>
        Elegance<br>
        <
